<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel — Student Manage System</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
:root {
  --clay-bg: #eae7e1;
  --clay-card: #f8f6f2;
  --clay-card-alt: #efece6;
  --clay-sidebar: #1c1a17;
  --clay-sidebar-hover: #2a2722;
  --gold: #c9a84c;
  --gold-light: #e8d5a0;
  --gold-dark: #a8882e;
  --espresso: #2d2420;
  --warm-gray: #8b7d6b;
  --cream: #faf8f5;
  --success: #3a7d5c;
  --success-light: #e6f0ea;
  --danger: #b44040;
  --danger-light: #f5e8e8;
  --info: #2c6085;
  --info-light: #e6edf3;
  --warning: #b8860b;
  --warning-light: #f5efe0;
  --radius-clay: 22px;
  --radius-clay-sm: 14px;
  --radius-clay-xs: 10px;
  --clay-shadow: -8px -8px 16px rgba(255,255,255,0.7), 8px 8px 16px rgba(174,166,155,0.25);
  --clay-shadow-sm: -4px -4px 10px rgba(255,255,255,0.7), 4px 4px 10px rgba(174,166,155,0.2);
  --clay-shadow-inset: inset -4px -4px 8px rgba(255,255,255,0.7), inset 4px 4px 8px rgba(174,166,155,0.2);
  --clay-shadow-lg: -12px -12px 24px rgba(255,255,255,0.7), 12px 12px 24px rgba(174,166,155,0.3);
  --clay-shadow-raised: -6px -6px 12px rgba(255,255,255,0.7), 6px 6px 12px rgba(174,166,155,0.25);
  --sidebar-width: 270px;
  --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--clay-bg);
  color: var(--espresso);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ====== APP LAYOUT ====== */
.app-container { display: flex; min-height: 100vh; }

/* ====== SIDEBAR ====== */
.sidebar {
  width: var(--sidebar-width);
  background: var(--clay-sidebar);
  display: flex;
  flex-direction: column;
  position: fixed;
  top: 0;
  left: 0;
  bottom: 0;
  z-index: 100;
  transition: transform var(--transition);
  box-shadow: 4px 0 20px rgba(0,0,0,0.2);
}

.sidebar-brand {
  padding: 26px 24px 20px;
  font-size: 19px;
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid rgba(201, 168, 76, 0.15);
  color: var(--gold-light);
  letter-spacing: -0.3px;
}

.sidebar-brand i {
  color: var(--gold);
  font-size: 26px;
  filter: drop-shadow(0 2px 4px rgba(201, 168, 76, 0.3));
}

.sidebar-user {
  padding: 20px 20px;
  display: flex;
  align-items: center;
  gap: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.05);
}

.avatar {
  width: 44px;
  height: 44px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 18px;
  flex-shrink: 0;
  color: var(--clay-sidebar);
  box-shadow: 0 4px 10px rgba(201, 168, 76, 0.25);
}

.user-name { font-weight: 600; font-size: 14px; color: var(--cream); }
.user-role { font-size: 12px; color: var(--warm-gray); }

.sidebar-nav { flex: 1; overflow-y: auto; padding: 16px 10px; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 18px;
  color: var(--warm-gray);
  text-decoration: none;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  border-radius: var(--radius-clay-sm);
  margin-bottom: 4px;
}

.nav-item:hover {
  background: var(--clay-sidebar-hover);
  color: var(--gold-light);
}

.nav-item.active {
  background: linear-gradient(135deg, rgba(201, 168, 76, 0.12), rgba(201, 168, 76, 0.05));
  color: var(--gold);
  box-shadow: inset 2px 2px 4px rgba(0,0,0,0.2), inset -1px -1px 2px rgba(255,255,255,0.05);
}

.nav-item i { width: 20px; text-align: center; font-size: 16px; }

.sidebar-footer {
  padding: 16px 14px;
  border-top: 1px solid rgba(255,255,255,0.05);
}

.btn-logout {
  background: transparent;
  color: var(--warm-gray);
  width: 100%;
  justify-content: center;
  padding: 12px;
  border-radius: var(--radius-clay-sm);
}

.btn-logout:hover {
  background: rgba(180, 64, 64, 0.1);
  color: #d47a7a;
}

/* ====== MAIN WRAPPER ====== */
.main-wrapper { margin-left: var(--sidebar-width); flex: 1; display: flex; flex-direction: column; min-height: 100vh; }

.topbar {
  display: flex;
  align-items: center;
  padding: 18px 32px;
  background: var(--clay-card);
  border-bottom: 1px solid rgba(174,166,155,0.15);
  position: sticky;
  top: 0;
  z-index: 50;
  gap: 16px;
  box-shadow: var(--clay-shadow-sm);
  margin: 16px 16px 0;
  border-radius: var(--radius-clay) var(--radius-clay) 0 0;
}

.sidebar-toggle { display: none; background: none; border: none; font-size: 20px; cursor: pointer; color: var(--espresso); }

.topbar h2 {
  font-size: 20px;
  font-weight: 700;
  flex: 1;
  letter-spacing: -0.4px;
  background: linear-gradient(135deg, var(--espresso), var(--gold-dark));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.topbar-right { display: flex; align-items: center; gap: 16px; }

.datetime {
  font-size: 13px;
  color: var(--warm-gray);
  font-weight: 500;
  background: var(--clay-bg);
  padding: 6px 16px;
  border-radius: 30px;
  box-shadow: var(--clay-shadow-sm);
}

.main-content {
  padding: 20px 32px 32px;
  flex: 1;
}

/* ====== BUTTONS ====== */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 22px;
  border: none;
  border-radius: var(--radius-clay-sm);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: var(--transition);
  text-decoration: none;
  font-family: 'Inter', sans-serif;
  letter-spacing: -0.2px;
}

.btn-sm { padding: 7px 16px; font-size: 12px; border-radius: var(--radius-clay-xs); }
.btn-block { width: 100%; justify-content: center; }

.btn-primary {
  background: linear-gradient(135deg, var(--gold), var(--gold-dark));
  color: #1c1a17;
  box-shadow: var(--clay-shadow-raised);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: -6px -6px 12px rgba(255,255,255,0.7), 8px 8px 16px rgba(174,166,155,0.3);
}

.btn-primary:active {
  transform: translateY(0);
  box-shadow: var(--clay-shadow-inset);
}

.btn-secondary {
  background: var(--clay-card-alt);
  color: var(--espresso);
  box-shadow: var(--clay-shadow-sm);
}

.btn-secondary:hover {
  transform: translateY(-1px);
}

.btn-success {
  background: linear-gradient(135deg, var(--success), #2d6a4f);
  color: #fff;
  box-shadow: var(--clay-shadow-raised);
}

.btn-success:hover { transform: translateY(-2px); }

.btn-danger {
  background: linear-gradient(135deg, var(--danger), #8b2d2d);
  color: #fff;
  box-shadow: var(--clay-shadow-raised);
}

.btn-danger:hover { transform: translateY(-2px); }

.btn-info {
  background: linear-gradient(135deg, var(--info), #1e4d6e);
  color: #fff;
  box-shadow: var(--clay-shadow-raised);
}

.btn-info:hover { transform: translateY(-2px); }

.btn-warning {
  background: linear-gradient(135deg, var(--warning), #8b6900);
  color: #fff;
  box-shadow: var(--clay-shadow-raised);
}

.btn-warning:hover { transform: translateY(-2px); }

.action-btns { display: flex; gap: 8px; }
.action-btns .btn { padding: 6px 12px; font-size: 12px; border-radius: var(--radius-clay-xs); }

/* ====== DASHBOARD STAT CARDS ====== */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 28px;
}

.stat-card {
  background: var(--clay-card);
  border-radius: var(--radius-clay);
  padding: 24px 26px;
  box-shadow: var(--clay-shadow);
  display: flex;
  align-items: center;
  gap: 18px;
  transition: var(--transition);
  border: 1px solid rgba(255,255,255,0.5);
}

.stat-card:hover {
  box-shadow: var(--clay-shadow-lg);
  transform: translateY(-3px);
}

.stat-icon {
  width: 54px;
  height: 54px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
  box-shadow: var(--clay-shadow-sm);
}

.stat-icon.blue { background: linear-gradient(135deg, #e6edf3, #d5e0ec); color: var(--info); }
.stat-icon.green { background: linear-gradient(135deg, #e6f0ea, #d4e8dd); color: var(--success); }
.stat-icon.yellow { background: linear-gradient(135deg, #f5efe0, #ede5d0); color: var(--warning); }
.stat-icon.red { background: linear-gradient(135deg, #f5e8e8, #edd5d5); color: var(--danger); }
.stat-icon.purple { background: linear-gradient(135deg, #ede8f5, #e0d8ed); color: #7c5cbf; }
.stat-icon.cyan { background: linear-gradient(135deg, #e0edf0, #cde0e8); color: #1a8a9e; }

.stat-info h3 {
  font-size: 28px;
  font-weight: 800;
  line-height: 1.2;
  letter-spacing: -1px;
  background: linear-gradient(135deg, var(--espresso), var(--gold-dark));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.stat-info p {
  font-size: 13px;
  color: var(--warm-gray);
  font-weight: 500;
}

/* ====== CHARTS ====== */
.charts-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
  margin-bottom: 28px;
}

.chart-card {
  background: var(--clay-card);
  border-radius: var(--radius-clay);
  padding: 24px;
  box-shadow: var(--clay-shadow);
  border: 1px solid rgba(255,255,255,0.5);
}

.chart-card h3 {
  font-size: 15px;
  margin-bottom: 18px;
  color: var(--espresso);
  font-weight: 600;
}

.chart-card canvas { max-height: 260px; }

/* ====== SECTION / TABLE CARDS ====== */
.section-card {
  background: var(--clay-card);
  border-radius: var(--radius-clay);
  box-shadow: var(--clay-shadow);
  overflow: hidden;
  margin-bottom: 24px;
  border: 1px solid rgba(255,255,255,0.5);
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 26px;
  border-bottom: 1px solid rgba(174,166,155,0.15);
  flex-wrap: wrap;
  gap: 12px;
}

.section-header h3 {
  font-size: 16px;
  font-weight: 700;
  color: var(--espresso);
}

.section-header h3 i { color: var(--gold); }

.section-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.table-wrap { overflow-x: auto; }

table { width: 100%; border-collapse: collapse; }

thead { background: var(--clay-card-alt); }

th {
  padding: 14px 18px;
  text-align: left;
  font-size: 11px;
  font-weight: 700;
  color: var(--warm-gray);
  text-transform: uppercase;
  letter-spacing: 0.8px;
}

td {
  padding: 14px 18px;
  font-size: 14px;
  border-bottom: 1px solid rgba(174,166,155,0.1);
  color: var(--espresso);
}

tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(201, 168, 76, 0.04); }

.badge {
  display: inline-block;
  padding: 4px 14px;
  border-radius: 30px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.3px;
}

.badge-success { background: var(--success-light); color: var(--success); }
.badge-warning { background: var(--warning-light); color: var(--warning); }
.badge-danger { background: var(--danger-light); color: var(--danger); }
.badge-info { background: var(--info-light); color: var(--info); }
.badge-secondary { background: var(--clay-card-alt); color: var(--warm-gray); }

/* ====== FORMS ====== */
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.form-grid .form-group.full { grid-column: 1 / -1; }
.form-group { margin-bottom: 16px; }

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--espresso);
  margin-bottom: 8px;
}

.form-group label i { width: 18px; color: var(--gold); }

.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 12px 16px;
  border: none;
  border-radius: var(--radius-clay-xs);
  font-size: 14px;
  transition: var(--transition);
  background: var(--clay-bg);
  color: var(--espresso);
  font-family: 'Inter', sans-serif;
  box-shadow: var(--clay-shadow-inset);
}

.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none;
  box-shadow: inset -4px -4px 8px rgba(255,255,255,0.8), inset 4px 4px 8px rgba(174,166,155,0.25), 0 0 0 3px rgba(201, 168, 76, 0.15);
}

.form-group textarea { resize: vertical; min-height: 90px; }

/* ====== MODAL ====== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(28, 26, 23, 0.5);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 20px;
}

.modal-box {
  background: var(--clay-card);
  border-radius: var(--radius-clay);
  width: 100%;
  max-width: 580px;
  box-shadow: var(--clay-shadow-lg);
  animation: modalIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  border: 1px solid rgba(255,255,255,0.5);
}

@keyframes modalIn {
  from { opacity: 0; transform: scale(0.93) translateY(12px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 26px;
  border-bottom: 1px solid rgba(174,166,155,0.15);
}

.modal-header h3 {
  font-size: 18px;
  font-weight: 700;
  background: linear-gradient(135deg, var(--espresso), var(--gold-dark));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.modal-close {
  background: var(--clay-bg);
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: var(--warm-gray);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--clay-shadow-sm);
  transition: var(--transition);
}

.modal-close:hover { color: var(--danger); }

.modal-body { padding: 26px; max-height: 60vh; overflow-y: auto; }

.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  padding: 18px 26px;
  border-top: 1px solid rgba(174,166,155,0.15);
}

/* ====== EMPTY STATE ====== */
.empty-state {
  text-align: center;
  padding: 48px 20px;
  color: var(--warm-gray);
}

.empty-state i {
  font-size: 48px;
  margin-bottom: 16px;
  color: rgba(174,166,155,0.4);
}

.empty-state p { font-size: 15px; font-weight: 500; }

/* ====== SCROLLBAR ====== */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(174,166,155,0.3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(174,166,155,0.5); }

/* ====== RESPONSIVE ====== */
@media (max-width: 768px) {
  .sidebar { transform: translateX(-100%); }
  .sidebar.open { transform: translateX(0); }
  .sidebar-toggle { display: block; }
  .main-wrapper { margin-left: 0; }
  .topbar { margin: 0; border-radius: 0; }
  .charts-grid { grid-template-columns: 1fr; }
  .form-grid { grid-template-columns: 1fr; }
  .stats-grid { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
  .topbar { padding: 14px 16px; }
  .main-content { padding: 16px; }
  .modal-box { max-width: 100%; margin: 10px; }
}

@media (max-width: 480px) {
  .stats-grid { grid-template-columns: 1fr 1fr; gap: 14px; }
  .stat-card { padding: 16px; }
  .stat-info h3 { font-size: 22px; }
  .section-header { flex-direction: column; align-items: flex-start; }
  .stat-icon { width: 46px; height: 46px; font-size: 18px; }
}
  </style>
</head>

</div>

<div id="modalOverlay" class="modal-overlay" style="display:none;">

</div>

};

function getData() {
  const raw = localStorage.getItem(DB_KEY);
  if (raw) {
    try { return JSON.parse(raw); } catch (e) { /* ignore */ }
  }
  localStorage.setItem(DB_KEY, JSON.stringify(defaultData));
  return JSON.parse(JSON.stringify(defaultData));
}

function saveData(data) {
  localStorage.setItem(DB_KEY, JSON.stringify(data));
}

function getNextId(data, key) {
  return data.nextId[key]++;
}

function getCourseName(data, id) {
  const c = data.courses.find(x => x.id === id);
  return c ? c.name : 'N/A';
}

function getSubjectName(data, id) {
  const s = data.subjects.find(x => x.id === id);
  return s ? s.name : 'N/A';
}

function getStaffName(data, id) {
  const s = data.staff.find(x => x.id === id);
  return s ? s.name : 'N/A';
}

function getStudentName(data, id) {
  const s = data.students.find(x => x.id === id);
  return s ? s.name : 'N/A';
}

function formatDate(d) {
  if (!d) return '';
  const date = new Date(d);
  return date.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
}

function capitalize(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);
}

        <h3><i class="fas fa-file-alt"></i> Leave Requests</h3>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>Staff/Student</th><th>Type</th><th>From</th><th>To</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody>
            ${data.leaves.length ? data.leaves.map((l, i) => `
              <tr>
                <td>${i + 1}</td>
                <td><strong>${getStaffName(data, l.staffId) || getStudentName(data, l.studentId) || 'Unknown'}</strong></td>
                <td><span class="badge badge-info">${l.role}</span></td>
                <td>${formatDate(l.fromDate)}</td>
                <td>${formatDate(l.toDate)}</td>
                <td>${l.reason}</td>
                <td><span class="badge ${l.status === 'approved' ? 'badge-success' : l.status === 'rejected' ? 'badge-danger' : 'badge-warning'}">${capitalize(l.status)}</span></td>
                <td>
                  ${l.status === 'pending' ? `<div class="action-btns">
                    <button class="btn btn-success btn-sm" onclick="approveLeave(${l.id})"><i class="fas fa-check"></i></button>
                    <button class="btn btn-danger btn-sm" onclick="rejectLeave(${l.id})"><i class="fas fa-times"></i></button>
                  </div>` : '-'}
                </td>
              </tr>
            `).join('') : `<tr><td colspan="8"><div class="empty-state"><p>No leave applications yet.</p></div></td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function approveLeave(id) {
  const l = state.data.leaves.find(x => x.id === id);
  if (l) l.status = 'approved';
  saveData(state.data); navigateTo('leaves');
}

function rejectLeave(id) {
  const l = state.data.leaves.find(x => x.id === id);
  if (l) l.status = 'rejected';
  saveData(state.data); navigateTo('leaves');
}

function renderFeedback(container) {
  const data = state.data;
  container.innerHTML = `
    <div class="section-card">
      <div class="section-header">
        <h3><i class="fas fa-comments"></i> Feedback Messages</h3>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>#</th><th>From</th><th>Type</th><th>Message</th><th>Reply</th><th>Actions</th></tr></thead>
          <tbody>
            ${data.feedbacks.length ? data.feedbacks.map((f, i) => `
              <tr>
                <td>${i + 1}</td>
                <td><strong>${getStaffName(data, f.staffId) || getStudentName(data, f.studentId) || 'Unknown'}</strong></td>
                <td><span class="badge badge-info">${f.role}</span></td>
                <td>${f.message}</td>
                <td>${f.reply ? f.reply : '<span class="badge badge-warning">Pending</span>'}</td>
                <td>
                  ${!f.reply ? `<button class="btn btn-primary btn-sm" onclick="replyFeedback(${f.id})"><i class="fas fa-reply"></i> Reply</button>` : '-'}
                </td>
              </tr>
            `).join('') : `<tr><td colspan="6"><div class="empty-state"><p>No feedback yet.</p></div></td></tr>`}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

function replyFeedback(id) {
  const data = state.data;
  const f = data.feedbacks.find(x => x.id === id);
  if (!f) return;
  showModal(
    'Reply to Feedback',
    `<div class="form-group"><label><i class="fas fa-reply"></i> Your Reply</label><textarea id="replyText" placeholder="Write your reply...">${f.reply || ''}</textarea></div>`,
    () => {
      const reply = document.getElementById('replyText').value.trim();
      if (!reply) { alert('Reply cannot be empty.'); return; }
      f.reply = reply;
      saveData(data); closeModal(); navigateTo('feedback');
    }
  );
}

function renderChart(canvasId, type, labels, data, colors) {
  const existing = state.chartInstances[canvasId];
  if (existing) existing.destroy();
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  state.chartInstances[canvasId] = new Chart(ctx, {
    type,
    data: {
      labels,
      datasets: [{
        data,
        backgroundColor: colors || ['#c9a84c', '#a8882e', '#e8d5a0', '#8b7d6b', '#5c5040', '#2d2420'],
        borderColor: '#f8f6f2',
        borderWidth: 3,
      }],
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      plugins: {
        legend: { display: type === 'doughnut', position: 'bottom', labels: { usePointStyle: true, padding: 16, font: { family: 'Inter' } } },
      },
      scales: type !== 'doughnut' ? { y: { beginAtZero: true, grid: { color: 'rgba(174,166,155,0.15)' }, ticks: { font: { family: 'Inter' } } }, x: { grid: { display: false }, ticks: { font: { family: 'Inter' } } } } : undefined,
    },
  });
}

function showModal(title, body, onSave) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  document.getElementById('modalOverlay').style.display = 'flex';
  const saveBtn = document.getElementById('modalSave');
  const newSave = saveBtn.cloneNode(true);
  saveBtn.parentNode.replaceChild(newSave, saveBtn);
  newSave.addEventListener('click', onSave);
  newSave.style.display = 'inline-flex';
  document.getElementById('modalCancel').onclick = closeModal;
  document.getElementById('modalClose').onclick = closeModal;
  document.getElementById('modalOverlay').onclick = (e) => {
    if (e.target === e.currentTarget) closeModal();
  };
}

function closeModal() {
  document.getElementById('modalOverlay').style.display = 'none';
}

function updateClock() {
  const now = new Date();
  document.getElementById('currentDateTime').textContent = now.toLocaleString('en-US', {
    weekday: 'short', year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
  });
}

document.addEventListener('DOMContentLoaded', () => {
  state.data = getData();
  renderSidebar();
  navigateTo('dashboard');
  updateClock();
  setInterval(updateClock, 60000);

  document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem(DB_KEY);
    location.reload();
  });

  document.getElementById('sidebarToggle').addEventListener('click', () => {
    document.getElementById('sidebar').classList.toggle('open');
  });
});
</script>
</body>
</html>
